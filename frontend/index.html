<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- viewport-fit=cover so the app reaches the edges on notched phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Matches manifest theme_color (vite.config.js): tints the Android
         browser chrome so an installed Urbora reads as one app. -->
    <meta name="theme-color" content="#0d3b2e" />
    <meta
      name="description"
      content="উর্বরা: ফসলের কী হয়েছে, জানুন ঘরে বসেই। Expert farm advice in Bangla on any phone: call, keypad or SMS. Every number from tested code and cited sources."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand fonts (brand/BRAND-CORE.md §5): Noto Serif Bengali display, Noto Sans Bengali text,
         Fraunces + Instrument Sans for Latin, Galada for the tagline only. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Galada&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" />
    <title>উর্বরা · স্বপ্ন ফলুক</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
