<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- viewport-fit=cover so the app reaches the edges on notched phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Matches manifest theme_color (vite.config.js): tints the Android
         browser chrome so an installed AgriSense reads as one app. -->
    <meta name="theme-color" content="#2f6b3f" />
    <meta
      name="description"
      content="Bangla-first farm planning: costed, weather-grounded season plans with a source behind every number."
    />
    <title>AgriSense — কৃষি পরামর্শ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
