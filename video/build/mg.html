<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* Urbora line-art scenes. Every frame is a pure function of time: render(scene, t). 1920x1080. */
@font-face{font-family:'NSerifB';font-weight:700;src:url(node_modules/@fontsource/noto-serif-bengali/files/noto-serif-bengali-bengali-700-normal.woff2)}
@font-face{font-family:'NSansB';font-weight:500;src:url(node_modules/@fontsource/noto-sans-bengali/files/noto-sans-bengali-bengali-500-normal.woff2)}
@font-face{font-family:'NSansB';font-weight:600;src:url(node_modules/@fontsource/noto-sans-bengali/files/noto-sans-bengali-bengali-600-normal.woff2)}
@font-face{font-family:'Galada';src:url(node_modules/@fontsource/galada/files/galada-bengali-400-normal.woff2)}
@font-face{font-family:'ISans';font-weight:500;src:url(node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-500-normal.woff2)}
:root{--shyamol:#0D3B2E;--sun:#F2A231;--kraft:#EBD9B4;--sepia:#6B4A1E;--straw:#FAF5EA;--paddy:#A8D65C;--ink:#11201A}
html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--kraft)}
#stage>*{position:absolute;inset:0}
#stage>svg{width:1920px;height:1080px}
.bn{font-family:'NSansB'}
</style></head>
<body><div id="stage"></div>
<script>
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const p=(t,a,b)=>cl((t-a)/(b-a));                    // linear progress of t across [a,b]
const e=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;          // ease in-out cubic
const eo=x=>1-Math.pow(1-x,3);                           // ease out cubic
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // ease out with overshoot
const C={shyamol:'#0D3B2E',sun:'#F2A231',kraft:'#EBD9B4',sepia:'#6B4A1E',straw:'#FAF5EA',paddy:'#A8D65C',ink:'#11201A',gold:'#C98A1E'};
const ASSET={};
async function load(){
  for(const f of ['field-sepia.svg','field-gold.svg','sweep-l.svg','mark.svg'])ASSET[f]=await (await fetch('assets/'+f)).text();
  await document.fonts.load('700 100px NSerifB');await document.fonts.load('500 40px NSansB');await document.fonts.load('600 40px NSansB');await document.fonts.load('80px Galada');await document.fonts.load('500 20px ISans');
}
const inner=svg=>svg.replace(/^[\s\S]*?<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');
const vb=svg=>(svg.match(/viewBox="([^"]+)"/)||[])[1];

/* shared defs: a light "pencil" wobble so lines look drawn, not vector-perfect */
const DEFS=`<defs><filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.29  0 0 0 0 0.12  0 0 0 0.10 0"/></filter></defs>`;
const PAPER=`<rect width="1920" height="1080" fill="${C.kraft}"/><rect width="1920" height="1080" filter="url(#paper)"/>`;
// draw a path progressively: returns attrs for stroke-dash reveal (pathLength normalised to 1)
const dash=(q)=>`pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1-cl(q)).toFixed(4)}"`;

function road(d,q,{w=46,id=''}={}){ // a country road drawn as two edges and a dashed centre
  return `<g ${id?`id="${id}"`:''} fill="none" stroke-linecap="round" filter="url(#rough)">
  <path d="${d}" stroke="${C.sepia}" stroke-width="${w}" ${dash(q)}/>
  <path d="${d}" stroke="${C.kraft}" stroke-width="${w-7}" ${dash(q)}/>
  <path d="${d}" stroke="${C.sepia}" stroke-width="2.4" stroke-dasharray="14 18" opacity="${q>0.98?0.7:0}"/></g>`;
}
function building(x,y,s,label,q){ // small government/bank building, engraved style
  const o=cl(q);return `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="${C.sepia}" stroke-width="3" stroke-linejoin="round" filter="url(#rough)" opacity="${o}">
  <path d="M-110 0 V-120 H110 V0 Z" fill="${C.straw}"/><path d="M-130 -120 L0 -190 L130 -120 Z" fill="#E3CC9F"/>
  <path d="M-80 0 V-95 M-40 0 V-95 M40 0 V-95 M80 0 V-95" stroke-width="5"/><path d="M-125 0 H125" stroke-width="5"/>
  ${label?`<text x="0" y="-135" text-anchor="middle" font-family="NSerifB" font-weight="700" font-size="46" fill="${C.sepia}" stroke="none">${label}</text>`:''}</g>`;
}
function phone(cx,cy,s,{kind='button',screen='',o=1}={}){ // outline phone; button phone has a keypad
  const w=kind==='button'?150:170,h=kind==='button'?300:330;
  let keys='';if(kind==='button')for(let r=0;r<4;r++)for(let c=0;c<3;c++)keys+=`<circle cx="${-40+c*40}" cy="${40+r*26}" r="9" fill="${C.sepia}" opacity=".85"/>`;
  const scr=kind==='button'?`<rect x="-56" y="-120" width="112" height="118" rx="8" fill="${C.straw}" stroke="${C.sepia}" stroke-width="3"/>`:`<rect x="-70" y="-140" width="140" height="265" rx="10" fill="${C.straw}" stroke="${C.sepia}" stroke-width="3"/>`;
  return `<g transform="translate(${cx} ${cy}) scale(${s})" opacity="${o}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="26" fill="#E3CC9F" stroke="${C.sepia}" stroke-width="5" filter="url(#rough)"/>${scr}${keys}${screen}</g>`;
}
function stalks(which,x,y,w,reveal,o=1){ // engraved paddy, revealed from the bottom up
  const s=ASSET[which],[,,vw,vh]=vb(s).split(' ').map(Number),h=w*vh/vw,id='c'+which.replace(/\W/g,'')+Math.round(x);
  return `<defs><clipPath id="${id}"><rect x="${x}" y="${y+h*(1-cl(reveal))}" width="${w}" height="${h}"/></clipPath></defs>
  <g clip-path="url(#${id})" opacity="${o}"><svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb(s)}" preserveAspectRatio="none" style="overflow:visible"><g fill="none" stroke="${(s.match(/stroke="([^"]+)"/)||[])[1]}" stroke-linecap="round" stroke-linejoin="round">${inner(s)}</g></svg></g>`;
}
function seal(cx,cy,size,o=1,sc=1){const s=ASSET['mark.svg'];return `<g opacity="${o}" transform="translate(${cx} ${cy}) scale(${sc}) translate(${-size/2} ${-size/2})"><svg width="${size}" height="${size}" viewBox="0 0 200 200">${inner(s)}</svg></g>`}
function text(x,y,str,{size=60,font='NSansB',weight=500,fill=C.shyamol,anchor='middle',o=1,dy=0}={}){
  return `<text x="${x}" y="${y+dy}" text-anchor="${anchor}" font-family="${font}" font-weight="${weight}" font-size="${size}" fill="${fill}" opacity="${o}">${str}</text>`}
const fadeUp=(t,a)=>({o:eo(p(t,a,a+.5)),dy:(1-eo(p(t,a,a+.5)))*24});

const SCENES={
/* S03 · 3 s · one question, many answers. The dry shoot fades into paper; a hand-drawn "?" writes itself; its tail forks
   into four arrows that end on the four answers to come (bottle, tea glass, phone video, sack); push toward the bottle. */
S03:{dur:3,draw(t){
  const photo=1-e(p(t,0,.6));
  const Q='M880 400 C 878 318, 950 292, 996 306 C 1052 324, 1062 394, 1016 428 C 978 456, 960 474, 960 530';
  const pos=[[470,330],[1450,330],[470,760],[1450,760]];
  const arrows=pos.map(([x,y],i)=>{const q=e(p(t,1.35+i*.15,1.85+i*.15)),L=x<960,U=y<540;
    const x0=960+(L?-50:50),y0=U?575:625,x1=x+(L?125:-125),y1=y+(U?70:-70),mx=(x0+x1)/2,my=(y0+y1)/2+(U?55:-55);
    const dx=x1-mx,dy=y1-my,dl=Math.hypot(dx,dy),ux=dx/dl,uy=dy/dl,h=(c,s)=>`${(x1-26*(ux*c-uy*s)).toFixed(1)} ${(y1-26*(uy*c+ux*s)).toFixed(1)}`;
    return `<path d="M${x0} ${y0} Q ${mx} ${my} ${x1} ${y1}" ${dash(q)}/><path d="M${h(.87,.5)} L${x1} ${y1} L${h(.87,-.5)}" opacity="${q>.97?1:0}"/>`}).join('');
  const ic=i=>e(p(t,1.7+i*.15,2.3+i*.15));
  const icons=[
    `<rect x="-26" y="-104" width="52" height="24" rx="4" ${dash(ic(0))}/><path d="M-22 -80 h44 v22 q32 14 32 52 v98 q0 12 -12 12 h-84 q-12 0 -12 -12 v-98 q0 -38 32 -52 z" ${dash(ic(0))}/>`,
    `<path d="M-48 -54 L-36 74 H36 L48 -54 Z" ${dash(ic(1))}/><path d="M-43 -8 H43" ${dash(ic(1))}/><path d="M-14 -74 q-14 -20 0 -40 M14 -74 q-14 -20 0 -40" ${dash(ic(1))}/>`,
    `<rect x="-54" y="-96" width="108" height="192" rx="16" ${dash(ic(2))}/><path d="M-16 -26 L26 0 L-16 26 Z" ${dash(ic(2))}/>`,
    `<path d="M-62 92 Q-84 0 -46 -56 L-30 -82 H30 L46 -56 Q84 0 62 92 Z" ${dash(ic(3))}/><path d="M-40 -58 H40" ${dash(ic(3))}/><path d="M-8 -82 q10 -22 28 -12" ${dash(ic(3))}/>`];
  const z=1+0.45*e(p(t,2.55,3.0));
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   <g transform="translate(470 330) scale(${z}) translate(-470 -330)">
   ${stalks('field-sepia.svg',-40,760,2000,e(p(t,.1,.9)),.45)}
   <g fill="none" stroke="${C.sepia}" stroke-width="16" stroke-linecap="round" filter="url(#rough)"><path d="${Q}" ${dash(e(p(t,.5,1.25)))}/></g>
   <circle cx="960" cy="590" r="13" fill="${C.sepia}" opacity="${eo(p(t,1.2,1.35))}"/>
   <g fill="none" stroke="${C.sepia}" stroke-width="5" stroke-linecap="round" filter="url(#rough)">${arrows}</g>
   <g fill="none" stroke="${C.sepia}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
     ${icons.map((g,i)=>`<g transform="translate(${pos[i][0]} ${pos[i][1]})">${g}</g>`).join('')}</g>
   </g></svg>${photo>0?`<img src="assets/kf_c01.png" style="width:1920px;height:1080px;object-fit:cover;opacity:${photo};filter:sepia(${1-photo})">`:''}`;
}},
/* S05 · 2.6 s · whose word? The four answers arrive as speech bubbles from the four edges, pile up in the middle and
   tangle into one scribbled knot; the knot shrinks to the bottom-left, where the S06 road begins. */
S05:{dur:2.6,draw(t){
  const Qs=['"এইটা নিয়া যান"','"পটাশ দিছিলাম"','"এইটা দিলেই হয়"','"আব্বা এইটাই দিত"'];
  const from=[[-300,260],[2220,300],[-300,760],[2220,720]],to=[[820,400],[1110,450],[830,590],[1090,640]];
  const tb=bq=>1-e(p(t,1.25,1.8));
  const bub=Qs.map((q,i)=>{const k=e(p(t,i*.12,.9+i*.12)),x=from[i][0]+(to[i][0]-from[i][0])*k,y=from[i][1]+(to[i][1]-from[i][1])*k,o=tb();
    return `<g transform="translate(${x} ${y}) rotate(${(i%2?4:-4)*(1-k)+(i-1.5)*2})" opacity="${o}">
      <path d="M-250 -62 h500 a22 22 0 0 1 22 22 v80 a22 22 0 0 1 -22 22 h-380 l-40 34 v-34 h-80 a22 22 0 0 1 -22 -22 v-80 a22 22 0 0 1 22 -22z" fill="${C.straw}" stroke="${C.sepia}" stroke-width="5" filter="url(#rough)"/>
      ${text(0,18,q,{size:50,weight:600,fill:C.shyamol})}</g>`}).join('');
  let d='';for(let i=0;i<=160;i++){const a=i/160*Math.PI*6;const r=150+60*Math.sin(a*1.7);d+=(i?'L':'M')+(960+r*Math.cos(a)+40*Math.sin(a*3.1)).toFixed(1)+' '+(520+r*.62*Math.sin(a*1.13)+30*Math.cos(a*2.3)).toFixed(1)+' '}
  const sk=e(p(t,2.2,2.6)),kx=960+(170-960)*sk,ky=520+(1040-520)*sk,ks=1-.85*sk;
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}${bub}
   <g transform="translate(${kx} ${ky}) scale(${ks}) translate(-960 -520)"><path d="${d}" fill="none" stroke="${C.sepia}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)" ${dash(e(p(t,1.2,2.2)))}/></g>
   </svg>`;
}},
/* S13a · 1.3 s · ten days later: a sketched wall calendar flicks through ten pages. */
S13a:{dur:1.3,draw(t){
  const BN='০১২৩৪৫৬৭৮৯',bn=n=>String(n).split('').map(c=>BN[+c]).join('');
  const fl=p(t,.2,1.0)*9,n=1+Math.min(9,Math.floor(fl)),fr=fl-Math.floor(fl),flipping=t>.2&&n<10;
  const lt=fadeUp(t,.45);
  const page=(num,o)=>`<rect x="-180" y="-150" width="360" height="330" rx="10" fill="${C.straw}" stroke="${C.sepia}" stroke-width="5"/>${text(0,110,bn(num),{size:210,font:'NSerifB',weight:700,fill:C.shyamol,o})}`;
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   <g transform="translate(960 440)" filter="url(#rough)" opacity="${eo(p(t,0,.2))}">
     <rect x="-200" y="-200" width="400" height="400" rx="16" fill="#E3CC9F" stroke="${C.sepia}" stroke-width="6"/>
     <rect x="-200" y="-200" width="400" height="56" rx="14" fill="${C.terra||'#B8472A'}" stroke="${C.sepia}" stroke-width="6"/>
     ${page(n,1)}
     ${flipping?`<g transform="translate(0 -150) scale(1 ${(1-2*fr).toFixed(3)}) translate(0 150)" opacity="${1-fr*.6}">${page(n,fr<.5?1:0)}</g>`:''}
     <circle cx="-110" cy="-200" r="14" fill="${C.kraft}" stroke="${C.sepia}" stroke-width="6"/><circle cx="110" cy="-200" r="14" fill="${C.kraft}" stroke="${C.sepia}" stroke-width="6"/>
   </g>
   ${text(960,830,'১০ দিন পর',{size:110,font:'NSerifB',weight:700,fill:C.shyamol,o:lt.o,dy:lt.dy})}
   </svg>`;
}},
/* S15a · 3.8 s · any phone, any hour: a smartphone and a button phone draw in on their words; a sun travels a dotted
   arc over them and becomes a crescent moon as the paper dims. */
S15a:{dur:3.8,draw(t){
  const a=back(p(t,.15,.6)),b=back(p(t,.95,1.4));
  const s=e(p(t,1.95,2.85)),bx=(q)=>560+800*q,by=(q)=>430-4*300*q*(1-q);
  const sx=bx(s),sy=by(s),mo=e(p(t,2.8,3.3)),dim=.28*e(p(t,2.7,3.4));
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   ${stalks('sweep-l.svg',-60,620,520,e(p(t,0,1)),.9)}
   <g transform="translate(1920 0) scale(-1 1)">${stalks('sweep-l.svg',-60,620,520,e(p(t,0,1)),.9)}</g>
   <path d="M560 430 Q 960 -170 1360 430" fill="none" stroke="${C.sepia}" stroke-width="3" stroke-dasharray="4 16" opacity="${.6*eo(p(t,1.8,2.1))}"/>
   <circle cx="${sx}" cy="${sy}" r="46" fill="${C.sun}" opacity="${eo(p(t,1.85,2.05))*(1-mo)}"/>
   <g opacity="${mo}"><circle cx="${sx}" cy="${sy}" r="46" fill="#F3E3B0"/><circle cx="${sx+22}" cy="${sy-12}" r="42" fill="${C.kraft}"/></g>
   ${phone(760,600,1.25*a,{kind:'smart',o:cl(a*3)})}
   ${phone(1160,600,1.3*b,{kind:'button',o:cl(b*3)})}
   <rect width="1920" height="1080" fill="#0D1B2A" opacity="${dim}"/>
   </svg>`;
}},
/* S06 · 8 s · the far office. Photo of the empty field dissolves into line art; a road winds to the upazila office; the sun crosses the sky while a tiny figure walks and never arrives. */
S06:{dur:8,draw(t,nophoto=false){
  const photo=nophoto?0:1-e(p(t,.3,1.5));
  const R='M170 1080 C 420 930, 300 820, 620 780 S 1000 760, 960 640 S 1180 520, 1430 500';
  const rq=e(p(t,1.2,2.6));
  const rp=document.createElementNS('http://www.w3.org/2000/svg','path');rp.setAttribute('d',R);const L=rp.getTotalLength();
  const wq=e(p(t,2.6,7.8))*0.62,pt=rp.getPointAtLength(L*wq);
  const sq=p(t,2.4,7.8),sx=260+sq*1380,sy=330-Math.sin(sq*Math.PI)*190;
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   <path d="M0 505 H1920" stroke="${C.sepia}" stroke-width="3" fill="none" ${dash(e(p(t,.2,1.3)))} filter="url(#rough)"/>
   <path d="M260 330 Q 950 -50 1640 330" stroke="${C.sepia}" stroke-width="3" stroke-dasharray="4 16" fill="none" opacity="${eo(p(t,2.2,2.8))*.6}"/>
   <circle cx="${sx}" cy="${sy}" r="46" fill="${C.sun}" opacity="${eo(p(t,2.2,2.8))}"/>
   ${stalks('field-sepia.svg',-40,560,1100,e(p(t,.5,1.8)))}
   ${road(R,rq)}
   ${building(1530,500,.95,'কৃষি অফিস',e(p(t,1.8,2.6)))}
   <g transform="translate(${pt.x} ${pt.y-18})" opacity="${eo(p(t,2.5,2.9))}" fill="${C.sepia}"><circle cx="0" cy="-30" r="8"/><path d="M-7 -20 h14 l3 26 h-20 z"/><path d="M-5 6 l-5 18 M5 6 l5 18" stroke="${C.sepia}" stroke-width="4"/></g>
   </svg>${photo>0?`<img src="assets/kf06.png" style="width:1920px;height:1080px;object-fit:cover;opacity:${photo};filter:sepia(${1-photo}) contrast(${1-.2*(1-photo)})">`:''}`;
}},
/* S06b · the same far-office scene, starting straight on paper (it follows the S05 knot). */
S06b:{dur:8,draw(t){return SCENES.S06.draw(t,true)}},
/* S07 · 3 s · mobile banking in passing. The road to the bank rolls up from the bank end into a phone with ৳. */
S07:{dur:3,draw(t){
  const R='M420 640 C 700 560, 900 760, 1180 660 S 1420 560, 1480 600';
  const roll=e(p(t,.5,2.1));        // 0 = full road, 1 = rolled up
  const ph=back(p(t,1.2,2.2));
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   ${building(330,700,1.1,'ব্যাংক ৳',1-e(p(t,1.2,2.0)))}
   <g fill="none" stroke-linecap="round" filter="url(#rough)">
     <path d="${R}" stroke="${C.sepia}" stroke-width="46" pathLength="1" stroke-dasharray="${(1-roll).toFixed(4)} 2" stroke-dashoffset="${(-roll).toFixed(4)}"/>
     <path d="${R}" stroke="${C.kraft}" stroke-width="39" pathLength="1" stroke-dasharray="${(1-roll).toFixed(4)} 2" stroke-dashoffset="${(-roll).toFixed(4)}"/></g>
   ${phone(1500,560,ph*1.05,{kind:'smart',o:cl(ph*3),screen:text(0,30,'৳',{size:120,font:'NSerifB',weight:700,fill:C.shyamol,o:eo(p(t,2.1,2.5))})})}
   </svg>`;
}},
/* S08 · 6 s · the field's road rolls up the same way into a button phone; the seal stamps on its screen; the name and the promise. */
S08:{dur:6,draw(t){
  const R='M300 900 C 560 820, 700 900, 900 780 S 1180 620, 1320 640';
  const roll=e(p(t,.3,1.9)),ph=back(p(t,1.0,2.0));
  const st=p(t,3.4,4.0),sealS=st<=0?0:1.35-0.35*back(st);
  const nm=fadeUp(t,3.8),ln=fadeUp(t,4.4);
  return `<svg viewBox="0 0 1920 1080">${DEFS}${PAPER}
   ${stalks('field-sepia.svg',-60,640,1300,1,1-0.75*e(p(t,1.6,2.6)))}
   <g fill="none" stroke-linecap="round" filter="url(#rough)">
     <path d="${R}" stroke="${C.sepia}" stroke-width="46" pathLength="1" stroke-dasharray="${(1-roll).toFixed(4)} 2" stroke-dashoffset="${(-roll).toFixed(4)}"/>
     <path d="${R}" stroke="${C.kraft}" stroke-width="39" pathLength="1" stroke-dasharray="${(1-roll).toFixed(4)} 2" stroke-dashoffset="${(-roll).toFixed(4)}"/></g>
   ${phone(1380,520,ph*1.35,{kind:'button',o:cl(ph*3),screen:seal(0,-61,106,st>0?1:0,sealS)})}
   ${text(180,470,'উর্বরা',{size:150,font:'NSerifB',weight:700,anchor:'start',o:nm.o,dy:nm.dy})}
   ${text(184,570,'কৃষি পরামর্শ, এখন হাতের ফোনে',{size:58,anchor:'start',fill:C.ink,o:ln.o,dy:ln.dy})}
   </svg>`;
}},
/* S14 · 12 s · why it can be trusted: ear → calculator → book, one word each; then the three ways in. */
S14:{dur:12,draw(t){
  const ic=[.4,1.6,2.8].map(a=>e(p(t,a,a+.9)));
  const ear=`<path d="M-40 60 Q-70 -60 0 -80 Q70 -80 60 -10 Q55 30 20 40 Q0 50 5 90" ${dash(ic[0])}/><path d="M-10 -20 Q10 -40 25 -15" ${dash(ic[0])}/>
    <path d="M100 -40 Q125 0 100 40 M130 -70 Q170 0 130 70" ${dash(p(t,1.0,1.4))}/>`;
  const calc=`<rect x="-70" y="-95" width="140" height="190" rx="14" ${dash(ic[1])}/><rect x="-48" y="-72" width="96" height="42" rx="4" ${dash(ic[1])}/>`+
    [0,1,2].map(r=>[0,1,2].map(c=>`<circle cx="${-35+c*35}" cy="${0+r*32}" r="9" fill="${C.sepia}" stroke="none" opacity="${eo(p(t,2.2+(r*3+c)*.04,2.5+(r*3+c)*.04))}"/>`).join('')).join('');
